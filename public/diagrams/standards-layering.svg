<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="none"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#232F3E">One plugin, layered per repo</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#6B6358">what is in front of the model on every session, whoever is driving</text>

  <!-- ENGINEERS -->
  <rect x="290" y="88" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <text x="340" y="113" text-anchor="middle" font-size="13" fill="#232F3E">engineer</text>
  <rect x="430" y="88" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <text x="480" y="113" text-anchor="middle" font-size="13" fill="#232F3E">engineer</text>
  <rect x="570" y="88" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <text x="620" y="113" text-anchor="middle" font-size="13" fill="#232F3E">engineer</text>
  <text x="700" y="113" font-size="13" fill="#6B6358">... ~20</text>

  <line x1="340" y1="128" x2="400" y2="166" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="480" y1="128" x2="480" y2="166" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="620" y1="128" x2="560" y2="166" stroke="#232F3E" stroke-width="1.5"/>
  <polygon points="480,170 476,162 484,162" fill="#232F3E"/>
  <text x="200" y="152" text-anchor="middle" font-size="11" fill="#6B6358">installed once; new capability ships on</text>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#6B6358">the next update, nobody has to be told</text>

  <!-- PLUGIN HUB -->
  <rect x="280" y="172" width="400" height="84" rx="8" fill="#F7DFB0" stroke="#D9A441" stroke-width="2"/>
  <text x="480" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#232F3E">team plugin</text>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#232F3E">skills, review agents, hooks, standards references</text>
  <text x="480" y="236" text-anchor="middle" font-size="11" fill="#6B6358">everything true of every repo lives here, in one place</text>

  <!-- FAN OUT -->
  <line x1="400" y1="256" x2="190" y2="300" stroke="#232F3E" stroke-width="1.5"/>
  <polygon points="186,301 194,294 196,302" fill="#232F3E"/>
  <line x1="480" y1="256" x2="480" y2="300" stroke="#232F3E" stroke-width="1.5"/>
  <polygon points="480,304 476,296 484,296" fill="#232F3E"/>
  <line x1="560" y1="256" x2="770" y2="300" stroke="#232F3E" stroke-width="1.5"/>
  <polygon points="774,301 764,302 766,294" fill="#232F3E"/>

  <!-- REPO A -->
  <rect x="60" y="306" width="260" height="150" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
  <text x="190" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">repo A</text>
  <rect x="80" y="342" width="220" height="30" rx="5" fill="#F7DFB0" stroke="#D9A441" stroke-width="1.2"/>
  <text x="190" y="361" text-anchor="middle" font-size="12" fill="#232F3E">team plugin (shared)</text>
  <rect x="80" y="378" width="220" height="30" rx="5" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.2"/>
  <text x="190" y="397" text-anchor="middle" font-size="12" fill="#232F3E"><tspan font-family="'JetBrains Mono', ui-monospace, monospace">CLAUDE.md</tspan> only what A needs</text>
  <text x="190" y="436" text-anchor="middle" font-size="11" fill="#6B6358">= model context for any session in A</text>

  <!-- REPO B -->
  <rect x="350" y="306" width="260" height="150" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
  <text x="480" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">repo B</text>
  <rect x="370" y="342" width="220" height="30" rx="5" fill="#F7DFB0" stroke="#D9A441" stroke-width="1.2"/>
  <text x="480" y="361" text-anchor="middle" font-size="12" fill="#232F3E">team plugin (shared)</text>
  <rect x="370" y="378" width="220" height="30" rx="5" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.2"/>
  <text x="480" y="397" text-anchor="middle" font-size="12" fill="#232F3E"><tspan font-family="'JetBrains Mono', ui-monospace, monospace">CLAUDE.md</tspan> only what B needs</text>
  <text x="480" y="436" text-anchor="middle" font-size="11" fill="#6B6358">= model context for any session in B</text>

  <!-- REPO C -->
  <rect x="640" y="306" width="260" height="150" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
  <text x="770" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">repo C</text>
  <rect x="660" y="342" width="220" height="30" rx="5" fill="#F7DFB0" stroke="#D9A441" stroke-width="1.2"/>
  <text x="770" y="361" text-anchor="middle" font-size="12" fill="#232F3E">team plugin (shared)</text>
  <rect x="660" y="378" width="220" height="30" rx="5" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.2"/>
  <text x="770" y="397" text-anchor="middle" font-size="12" fill="#232F3E"><tspan font-family="'JetBrains Mono', ui-monospace, monospace">CLAUDE.md</tspan> only what C needs</text>
  <text x="770" y="436" text-anchor="middle" font-size="11" fill="#6B6358">= model context for any session in C</text>

  <!-- bottom strip -->
  <rect x="40" y="478" width="880" height="42" rx="8" fill="#F5F1EA" stroke="#E8E2D6" stroke-width="1"/>
  <text x="480" y="504" text-anchor="middle" font-size="13" fill="#232F3E">The rule for where something lives: does it apply to one repo, or to all of them?</text>
</svg>
