<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4AB9C"/>
    </marker>
  </defs>

  <text x="480" y="42" text-anchor="middle" font-size="23" font-weight="600" fill="#232F3E">The two ends of AI-driven work</text>

  <!-- arrows between the boxes -->
  <line x1="302" y1="168" x2="346" y2="168" stroke="#B4AB9C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="168" x2="656" y2="168" stroke="#B4AB9C" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- DEFINE (human) -->
  <rect x="40" y="92" width="260" height="152" rx="10" fill="#F4F7FF" stroke="#2A4B8C" stroke-width="2"/>
  <rect x="128" y="112" width="84" height="24" rx="12" fill="#2A4B8C"/>
  <text x="170" y="128" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#FFFFFF">HUMAN</text>
  <text x="170" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#232F3E">Define</text>
  <text x="170" y="212" text-anchor="middle" font-size="14" fill="#6B6358">say what good looks like</text>

  <!-- EXECUTE (handed off) -->
  <rect x="350" y="92" width="260" height="152" rx="10" fill="#F5F3EF" stroke="#B4AB9C" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="422" y="112" width="116" height="24" rx="12" fill="#EDE8DF"/>
  <text x="480" y="128" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#8A8072">HANDED OFF</text>
  <text x="480" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#8A8072">Execute</text>
  <text x="480" y="212" text-anchor="middle" font-size="14" fill="#6B6358">the AI writes the implementation</text>

  <!-- VERIFY (human, bottleneck) -->
  <rect x="660" y="92" width="260" height="152" rx="10" fill="#FCEAF3" stroke="#E7157B" stroke-width="3"/>
  <rect x="748" y="112" width="84" height="24" rx="12" fill="#2A4B8C"/>
  <text x="790" y="128" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#FFFFFF">HUMAN</text>
  <text x="790" y="182" text-anchor="middle" font-size="26" font-weight="700" fill="#232F3E">Verify</text>
  <text x="790" y="212" text-anchor="middle" font-size="14" fill="#6B6358">tell whether it's right</text>

  <text x="170" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#2A4B8C">your judgement</text>
  <text x="480" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#8A8072">handed off</text>
  <text x="790" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#2A4B8C">your judgement</text>

  <text x="480" y="322" text-anchor="middle" font-size="14" font-style="italic" fill="#6B6358">Both ends are yours. Verification is the one that scales worst as the middle speeds up.</text>
</svg>
